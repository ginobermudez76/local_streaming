name: CI - Code Quality, Format & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  format-and-lint:
    name: Code Formatting & Linting Check
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify Code Formatting (dotnet format)
        run: dotnet format --verify-no-changes --verbosity normal

  build-and-test:
    name: Build & Unit Tests (102 Tests)
    runs-on: windows-latest
    needs: format-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Solution (Release)
        run: dotnet build --configuration Release

      - name: Run Unit Tests with TRX Logger
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: "**/test-results.trx"

